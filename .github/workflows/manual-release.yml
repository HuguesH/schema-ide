name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Display Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the MAJOR.MINOR.PATCH format (for example 0.1.1)." >&2
            exit 1
          fi

      - name: Create release branch and update version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          branch_name="release-${RELEASE_VERSION}"
          if git ls-remote --exit-code --heads origin "$branch_name" >/dev/null 2>&1; then
            echo "Branch $branch_name already exists." >&2
            exit 1
          fi
          git checkout -b "$branch_name"
          npm version "$RELEASE_VERSION" --no-git-tag-version
          echo "branch=$branch_name" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build solution
        run: npm run build

      - name: Commit and push release branch
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: prepare release ${{ steps.release.outputs.version }}"
          git push --set-upstream origin "$RELEASE_BRANCH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "chore: prepare release $RELEASE_VERSION" \
            --body "This pull request updates the project version to $RELEASE_VERSION and includes the validated production build."
